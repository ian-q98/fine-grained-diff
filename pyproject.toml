[project]
name = "finediff"
version = "0.1.0"
description = "Text diffs that highlight the words that changed inside a modified line"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ian-q98" }]

[project.scripts]
finediff = "finediff.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finediff*"]
